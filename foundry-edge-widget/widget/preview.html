<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Foundry Edge · Live preview</title><link rel="stylesheet" href="dashboard.css" /></head>
<body><main>
<header><div><span class="eyebrow">FOUNDRY EDGE</span><h1>Character dashboard</h1></div><div class="connection"><span id="connection">Not paired</span><button id="forget" hidden>Forget device</button></div></header>
<section id="pairing" class="panel"><h2>Bring your character to the Edge</h2><p>Enter the pairing code from your connector administrator.</p><form id="pair-form"><label>Pairing code <input id="code" autocomplete="off" required maxlength="128" /></label><button>Pair this preview</button></form><p class="muted">Live web preview · physical iCUE compatibility is still unverified.</p></section>
<section id="dashboard" hidden><div class="toolbar"><label>Character <select id="characters"></select></label><span id="world" class="muted"></span><button id="refresh">Refresh</button></div>
<div class="layout"><aside class="panel"><div class="portrait" aria-hidden="true">✦</div><h2 id="name"></h2><p class="muted">Player character</p><div class="vitals"><div><strong id="hp">—</strong><span>HIT POINTS</span></div><div><strong id="ac">—</strong><span>ARMOR CLASS</span></div></div><p id="temp"></p><div class="hp-buttons"><button data-hp="damage">Damage</button><button data-hp="healing">Heal</button><button data-hp="temp">Set temp HP</button></div><p id="speed" class="muted"></p></aside>
<section class="panel details"><nav aria-label="Character sheet"><button data-tab="abilities" class="active">Abilities</button><button data-tab="skills">Skills</button><button data-tab="spells">Spells</button><button data-tab="inventory">Inventory</button><button data-tab="features">Features</button><button data-tab="resources">Resources</button></nav><div id="sheet"></div></section></div></section>
<p id="status" role="status" aria-live="polite">Ready to pair.</p><button id="check-status" hidden>Check action status</button><p><a href="/admin">Manage devices and pairing</a></p>
<dialog id="action-dialog"><form id="action-form"><h2 id="action-title"></h2><label id="amount-label">Amount<input id="amount" type="number" min="0" max="100000" step="1" inputmode="numeric" /></label><label id="mode-label">Roll mode<select id="mode"><option value="normal">Normal</option><option value="advantage">Advantage</option><option value="disadvantage">Disadvantage</option></select></label><p id="action-note" class="muted"></p><div class="dialog-buttons"><button type="button" id="cancel">Cancel</button><button id="confirm">Confirm</button></div></form></dialog>
</main><script type="module" src="src/app.js"></script></body></html>
