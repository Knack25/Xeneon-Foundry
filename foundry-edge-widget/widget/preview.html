<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Foundry Edge · Live preview</title><link rel="stylesheet" href="dashboard.css" /></head>
<body><main>
<header><div><span class="eyebrow">FOUNDRY EDGE</span><h1>Character dashboard</h1></div><div class="connection"><span id="connection">Not paired</span><button id="forget" hidden>Forget device</button></div></header>
<section id="pairing" class="panel"><h2>Bring your character to the Edge</h2><p>Enter the pairing code from your connector administrator.</p><form id="pair-form"><label>Pairing code <input id="code" autocomplete="off" required maxlength="128" /></label><button>Pair this preview</button></form><p class="muted">Live web preview · physical iCUE compatibility is still unverified.</p></section>
<section id="dashboard" hidden><div class="toolbar"><label>Character <select id="characters"></select></label><span id="world" class="muted"></span><button id="refresh">Refresh</button></div>
<div class="layout"><aside class="panel"><div class="portrait" aria-hidden="true"><img id="portrait-image" hidden alt="" />✦</div><h2 id="name"></h2><p class="muted">Player character</p><div class="vitals"><div><strong id="hp">—</strong><span>HIT POINTS</span></div><div><strong id="ac">—</strong><span>ARMOR CLASS</span></div></div><p id="temp"></p><div class="hp-buttons"><button data-hp="damage">Damage</button><button data-hp="healing">Heal</button><button data-hp="temp">Set temp HP</button></div><p id="speed" class="muted"></p></aside>
<section class="panel details"><p id="combat-status" role="status"></p><nav aria-label="Character sheet"><button data-tab="quick">Quick Actions</button><button data-tab="session">Session</button><button data-tab="abilities" class="active">Abilities</button><button data-tab="attacks">Attacks</button><button data-tab="skills">Skills</button><button data-tab="spells">Spells</button><button data-tab="inventory">Inventory</button><button data-tab="features">Features</button><button data-tab="resources">Resources</button><button data-tab="details">Details</button><button data-tab="display">Display</button></nav><input id="sheet-search" aria-label="Search actions or items" placeholder="Search" hidden /><select id="spell-filter" aria-label="Spell filter" hidden><option value="all">All spells</option><option value="prepared">Prepared</option><option value="concentration">Concentration</option><option value="ritual">Ritual</option><option value="0">Level 0</option><option value="1">Level 1</option><option value="2">Level 2</option><option value="3">Level 3</option><option value="4">Level 4</option><option value="5">Level 5</option><option value="6">Level 6</option><option value="7">Level 7</option><option value="8">Level 8</option><option value="9">Level 9</option></select><select id="school-filter" aria-label="Spell school" hidden><option value="">All schools</option><option value="abj">Abjuration</option><option value="con">Conjuration</option><option value="div">Divination</option><option value="enc">Enchantment</option><option value="evo">Evocation</option><option value="ill">Illusion</option><option value="nec">Necromancy</option><option value="trs">Transmutation</option></select><div id="sheet"></div></section></div></section>
<p id="status" role="status" aria-live="polite">Ready to pair.</p><button id="check-status" hidden>Check action status</button><p><a href="/admin">Manage devices and pairing</a></p>
<dialog id="action-dialog"><form id="action-form"><h2 id="action-title"></h2><label id="amount-label">Amount<input id="amount" type="number" min="0" max="100000" step="1" inputmode="numeric" /></label><label id="mode-label">Roll mode<select id="mode"><option value="normal">Normal</option><option value="advantage">Advantage</option><option value="disadvantage">Disadvantage</option></select></label><label id="attack-mode-label" hidden>Weapon mode<select id="attack-mode"></select></label><label id="ammunition-label" hidden>Ammunition<select id="ammunition"></select></label><label id="slot-label" hidden>Spell slot<select id="slot"></select></label><label id="text-label" hidden>Value<textarea id="text-value" maxlength="2000" rows="4"></textarea></label><label id="choice-label" hidden>Destination<select id="choice"></select></label><label id="dc-label" hidden>Concentration DC<input id="dc" type="number" min="1" max="100" value="10" /></label><p id="action-note" class="muted"></p><div class="dialog-buttons"><button type="button" id="cancel">Cancel</button><button id="confirm">Confirm</button></div></form></dialog>
</main><script type="module" src="src/app.js"></script></body></html>
